<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Panel</title><style>body{font-family:system-ui;margin:0;background:#0f1115;color:#eee}.nav{padding:16px 22px;background:#181b21}.nav a{margin-right:15px;color:#8ab4f8}.main{padding:22px;max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card{background:#181b21;border:1px solid #292d36;border-radius:14px;padding:18px}input,button{padding:10px;margin:5px;border-radius:8px}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #292d36;text-align:left}</style></head>
<body><div class="nav"><b>Admin Panel</b> &nbsp; <a href="/">Home</a><a href="/panel">Dashboard</a><a href="/admin/audit">Audit</a><a href="/logout">Logout</a></div>
<div class="main"><h1>Admin Dashboard</h1><div class="grid"><div class="card"><h3>Admin</h3><b>{{username}}</b></div><div class="card"><h3>Total Users</h3><b>{{user_count}}</b></div><div class="card"><h3>Telegram</h3><b>{{telegram_status}}</b></div></div>
<h2>Create User</h2><form method="post"><input name="username" placeholder="username" required><input name="password" type="password" placeholder="password" required><button>Create user</button></form>
<h2>Users</h2><table><tr><th>Username</th><th>Role</th><th>Status</th><th>Created</th></tr>{{rows|safe}}</table></div></body></html>
